 $('start').hidden=true;$('download').hidden=true;
 channel.onmessage=e=>{const v=e.data||{};if(v.id!==nonce)return;

   localStorage.setItem('mrm-p107-qa:'+nonce+':settings',JSON.stringify({enabled:false}));
   channel.postMessage({t:'disabled',id:nonce,caseId:v.caseId,origin:location.origin});
  }

 };
 channel.postMessage({t:'ready',id:nonce,origin:location.origin});
 return;
}
function once(type,id,n,timeout=8500){return new Promise((resolve,reject)=>{
 const timer=setTimeout(()=>{channel.removeEventListener('message',fn);reject(Error('second tab timeout: '+type))},timeout);
 const fn=e=>{const x=e.data||{};if(x.t===type&&x.id===id&&(n==null||n===x.caseId)){
  clearTimeout(timer);channel.removeEventListener('message',fn);resolve(x)
 }};
 channel.addEventListener('message',fn)
})}
function waitFor(f,limit=8000){return new Promise((resolve,reject)=>{
 const started=Date.now(),timer=setInterval(()=>{if(f()){clearInterval(timer);resolve()}
 else if(Date.now()-started>limit){clearInterval(timer);reject(Error('async pause timeout'))}},20)
})}
const stamp=()=>new Date().toISOString(),sha='9ec98b8e3107dcb47554f4212a2ddb2eb89883950130974b8d03f71bd05244c6';
$('start').onclick=async()=>{
 $('start').disabled=true;$('report').replaceChildren();show('正在启动两个同源标签页…');
 const id=crypto.randomUUID(),url=new URL(location.href);url.searchParams.set('role','peer');url.searchParams.set('id',id);
 const other=window.open(url.href,'_blank');if(!other){show('HOLD：第二标签页被浏览器拦截，请允许弹出窗口');$('start').disabled=false;return}
 const prefix='mrm-p107-qa:'+id+':',PID='p107-syn-'+id.slice(0,8),PROJ=prefix+'project:',
  setting=prefix+'settings',indexKey=prefix+'index',journalKey=prefix+'journal';
 const local=()=>({project:{name:'SYNTH-LOCAL'},budget:[{id:'one',paidAmt:1.11}],finance:{payments:[],audit:[]}}),
 cloud=()=>({project:{name:'SYNTH-CLOUD'},budget:[{id:'one',paidAmt:2.22}],finance:{payments:[],audit:[]}});
 const enabled=()=>JSON.parse(localStorage.getItem(setting)||'{}').enabled===true;
 const ls={get:k=>localStorage.getItem(k)},getAllProjects=()=>JSON.parse(localStorage.getItem(indexKey)||'[]');
 const saveAllProjects=x=>localStorage.setItem(indexKey,JSON.stringify(x)),nowIso=stamp;
 let current=PID,state=local(),step=0,stopAt=0,held=null,backups=0,rendered=0,scheduled=0,storageSeen=false;
 const onStorage=e=>{if(e.key===setting){try{if(JSON.parse(e.newValue||'{}').enabled===false)storageSeen=true}catch{}}};
 window.addEventListener('storage',onStorage);
 let db=null, results=[],outcome='HOLD',problem=null;
 try{
  const ready=once('ready',id),timer=setInterval(()=>channel.postMessage({t:'ping',id}),100);

  db=await new Promise((resolve,reject)=>{req.onupgradeneeded=()=>req.result.createObjectStore('kv');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});

  const download=()=>{backups++},writeJournal=(pid,doc)=>localStorage.setItem(journalKey,JSON.stringify({project:doc.project.name,cents:Math.round((doc.budget?.[0]?.paidAmt||0)*100)}));
  const appGlobals=()=>({current}),loadProject=()=>{state=JSON.parse(localStorage.getItem(PROJ+PID));return true};
  const updateProjectSelector=()=>{},renderAll=()=>{},render=()=>{rendered++},scheduleSync=()=>{scheduled++},showToast=()=>{};
  let _finOpenPending=false;
    async function useCloudCopy(pid) { // onboarding: the cloud already had this project; P1-07 scoped asynchronous guard
    if (!enabled()) return;

    download({ kind: 'MRM_V4_ONBOARDING_LOCAL_COPY', projectId: pid, createdAt: nowIso(), local: ls.get(PROJ + pid) }, 'BEFORE_USING_CLOUD_COPY');

    } else { try { updateProjectSelector(); } catch {} }
    await store.set('s5:view:' + pid, out);
    if (!enabled()) return; // P1-07: no rendering or scheduling after another tab disabled backup
    render(); scheduleSync(300);
  }

  async function runCase(n){
   step=0;stopAt=n===6?0:n;held=null;backups=0;rendered=0;scheduled=0;storageSeen=false;
   localStorage.setItem(setting,JSON.stringify({enabled:true}));

    if(a.origin!==location.origin||enabled())throw Error('cross-tab disable not observed');

   }
   await task;
   const project=JSON.parse(localStorage.getItem(PROJ+PID)),metadata=getAllProjects()[0],journal=JSON.parse(localStorage.getItem(journalKey));
   const expected=n<=4?'SYNTH-LOCAL':'SYNTH-CLOUD';
   const okay=project.project.name===expected&&metadata.name===expected&&journal.project===expected&&journal.cents===(n<=4?111:222)&&
   backups===1&&rendered===(n===6?1:0)&&scheduled===(n===6?1:0)&&enabled()===(n===6)&&(n===6||storageSeen);
   return {case:n,result:okay?'PASS':'FAIL',app:project.project.name,index:metadata.name,journal:journal.project,
     journalCents:journal.cents,postDisableSyncScheduled:scheduled,postDisableRender:rendered,crossTabStorageEvent:n<=5?storageSeen:null};
  }
  for(let n=1;n<=6;n++){show('正在执行 '+n+'/6：真实双标签＋合成数据');const r=await runCase(n);results.push(r);
   line(r.result+' · Case '+n+' · app/index/journal='+r.app+'/'+r.index+'/'+r.journal+' · sync='+r.postDisableSyncScheduled);
  }
  outcome=results.every(x=>x.result==='PASS')?'PASS':'HOLD';
  show(outcome==='PASS'?'6/6 PASS：真实同源双标签，合成数据':'HOLD：至少一项测试失败');
 }catch(e){problem=String(e?.message||e);show('HOLD：'+problem);line('ERROR '+problem)}
 finally{
  const evidence={type:'MRM P1-07 real same-origin dual-tab synthetic race',outcome,total:6,passed:results.filter(x=>x.result==='PASS').length,
   timestamp:stamp(),origin:location.origin,userAgent:navigator.userAgent,p1IndexBlobSha:'04bbf14304d4ef67a7ce6647d65cf81980b5b25f',

   issue:problem,cases:results};
  $('download').hidden=false;$('download').onclick=()=>{const blob=new Blob([JSON.stringify(evidence,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='MRM_P1_07_REAL_TWO_TABS_SYNTHETIC_RESULT.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
